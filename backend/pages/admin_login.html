<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/style/common.css">
    <script src="/languages/scripts.js"></script>
    <script src="/languages/translations.js"></script>
</head>

<body onload="loadLanguage();">

    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header>
        <div class="logo">
            <div>
                <a href="/" class="logo-link">
                    <div class="logo">
                        <div class="logo-icon"></div>
                        <div>
                                                        <div class="logo-text"><p class="languageclass" id="logo-text">SensorProject</p></div>
                            <div class="logo-sub"><p class="languageclass" id="logo-sub">Semester IV · Group 11</p></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div class="header-right">
            <select id="langSwitcher" name="language" style="margin-right:16px;"  onchange="setLanguage(this); saveLanguage();">
                <option value="en">EN</option>
                <option value="dk">DK</option>
            </select>
            <span class="status-dot"></span>
            <p class="languageclass" id="welcome-status-online">system online</p>
        </div>
    </header>

    <div class="main">
        <div class="card">

            <div class="card-header">
                <div class="card-eyebrow"><p class="languageclass" id="admin-card-eyebrow">Restricted Access</p></div>
                <div class="card-title"><p class="languageclass" id="admin-card-title">Admin Portal</p></div>
                <div class="card-sub"><p class="languageclass" id="admin-card-sub">Sign in with your admin credentials</p></div>
            </div>

            <!-- Login panel -->
            <div class="input-group">
                <label class="input-label"><p class="languageclass" id="welcome-login-username-label">Username</p></label>
                <input type="text" placeholder="admin username" id="login-id">
            </div>
            <div class="input-group">
                <label class="input-label"><p class="languageclass" id="welcome-login-password-label">Password</p></label>
                <input type="password" placeholder="••••••••" id="login-pw">
            </div>
            <div id="login-error" style="color: #ff6b6b; font-size: 12px; margin-bottom: 10px; display: none;"></div>
            <button class="btn btn-primary" onclick="handleLogin()"><p class="languageclass" id="shared-sign-in-button">▶ Sign In</p></button>

            <div class="divider"></div>

            <a href="/" class="btn btn-secondary"><p class="languageclass" id="shared-back-to-user-login">← Back to User Login</p></a>

        </div>
    </div>

    <footer>
        <p class="languageclass" id="welcome-footer-prefix">SEMESTER-IV-SENSORPROJECT · Meet the team of</p> <a href="/developers"><p class="languageclass" id="welcome-footer-link">Group 11</p></a>
    </footer>

    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/check-admin');
                const data = await response.json();
                if (data.authenticated && data.is_admin) {
                    window.location.href = '/admin/dashboard';
                }
            } catch (error) {
                // User not logged in, stay on login page
            }
        });

        async function handleLogin() {
            const username = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-pw').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (!username || !password) {
                errorDiv.textContent = 'Please enter both username and password.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/admin/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorDiv.textContent = 'Invalid credentials or not an admin.';
                    errorDiv.style.display = 'block';
                    document.getElementById('login-pw').value = '';
                }
            } catch (error) {
                errorDiv.textContent = 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        }

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>

</body>

</html>
