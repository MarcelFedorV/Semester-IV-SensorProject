<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/style/common.css?v=20260518">
    <script src="/languages/scripts.js"></script>
    <script src="/languages/translations.js"></script>
    <style>
        .user-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }

        .user-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--mono);
            font-size: 11px;
        }

        .user-info {
            flex: 1;
        }

        .user-username {
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-email {
            color: var(--text-dim);
            font-size: 10px;
        }

        .user-role {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 9px;
            margin-right: 8px;
        }

        .user-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-small {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 3px;
            font-family: var(--mono);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-small:hover {
            border-color: var(--muted);
            color: var(--text);
        }

        .btn-small.danger {
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .btn-small.danger:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.5);
        }

        .tabs-admin {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .tab-admin {
            flex: 1;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            padding: 9px 12px;
            text-align: center;
            cursor: pointer;
            color: var(--text-dim);
            background: transparent;
            border: none;
            letter-spacing: .1em;
            text-transform: uppercase;
            transition: all .15s;
        }

        .tab-admin.active {
            background: rgba(0, 229, 255, .1);
            color: var(--accent);
        }

        .tab-admin:not(.active):hover {
            color: var(--text);
        }

        .tab-panel-admin {
            display: none;
        }

        .tab-panel-admin.active {
            display: block;
        }
    </style>
</head>

<body onload="loadLanguage();">

    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header>
        <div class="logo">
            <div>
                <a href="/" class="logo-link">
                    <div class="logo">
                        <div class="logo-icon"></div>
                        <div>
                            <div class="logo-text">
                                <p class="languageclass" id="logo-text">SensorProject</p>
                            </div>
                            <div class="logo-sub">
                                <p class="languageclass" id="logo-sub">Semester IV · Group 11</p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div class="header-right">
            <span class="status-dot"></span>
            ADMIN MODE
        </div>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
            <span id="username-display"
                style="font-family: var(--mono); font-size: 11px; color: var(--text-dim);"></span>
            <a href="#" onclick="handleLogout(); return false;"
                style="font-family: var(--mono); font-size: 11px; color: var(--accent); text-decoration: none; cursor: pointer;">
                [LOGOUT]
            </a>
        </div>
    </header>

    <div class="main">
        <div class="card">

            <div class="card-header">
                <div class="card-eyebrow">Administration</div>
                <div class="card-title">Admin Dashboard</div>
                <div class="card-sub">Manage users and system accounts</div>
            </div>

            <!-- Tab switcher -->
            <div class="tabs-admin">
                <button class="tab-admin active" onclick="switchAdminTab('users')">Users</button>
                <button class="tab-admin" onclick="switchAdminTab('create')">Create User</button>
            </div>

            <!-- Users List Panel -->
            <div class="tab-panel-admin active" id="panel-users">
                <div class="section-label">All Users</div>
                <div id="users-list" class="user-list">
                    <p style="color: var(--text-dim); font-family: var(--mono); font-size: 11px;">Loading users...</p>
                </div>
            </div>

            <!-- Create User Panel -->
            <div class="tab-panel-admin" id="panel-create">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <input type="text" id="new-username" placeholder="New username">
                </div>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" id="new-password" placeholder="New password">
                </div>
                <div class="input-group">
                    <label class="input-label">Email (optional)</label>
                    <input type="email" id="new-email" placeholder="user@example.com">
                </div>
                <div class="input-group">
                    <label class="input-label">Role</label>
                    <select id="new-role"
                        style="width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--text); outline: none; transition: border-color .15s;">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div id="create-error" style="color: #ff6b6b; font-size: 12px; margin-bottom: 10px; display: none;">
                </div>
                <div id="create-success" style="color: #00ff9d; font-size: 12px; margin-bottom: 10px; display: none;">
                </div>
                <button class="btn btn-primary" onclick="createNewUser()">▶ Create User</button>
            </div>

            <div class="divider"></div>

            <a href="/ble" class="btn btn-secondary">BLE Scanner</a>

            <div class="divider"></div>

            <a href="/" class="btn btn-secondary">← Back to Home</a>

        </div>
    </div>

    <footer>
        SEMESTER-IV-SENSORPROJECT &nbsp;·&nbsp; Meet the team of <a href="/developers">Group 11</a>
    </footer>

    <script>
        // Load users on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/check-admin');
                const data = await response.json();

                if (!data.authenticated || !data.is_admin) {
                    window.location.href = '/admin/login';
                    return;
                }

                document.getElementById('username-display').textContent = data.user;
                loadUsers();
            } catch (error) {
                window.location.href = '/admin/login';
            }
        });

        function switchAdminTab(tab) {
            document.querySelectorAll('.tab-admin').forEach((t, i) => {
                t.classList.toggle('active', ['users', 'create'][i] === tab);
            });
            document.querySelectorAll('.tab-panel-admin').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                if (!response.ok) {
                    document.getElementById('users-list').innerHTML = '<p style="color: #ff6b6b; font-family: var(--mono); font-size: 11px;">Failed to load users</p>';
                    return;
                }

                const data = await response.json();
                const usersList = document.getElementById('users-list');

                if (data.users.length === 0) {
                    usersList.innerHTML = '<p style="color: var(--text-dim); font-family: var(--mono); font-size: 11px;">No users found</p>';
                    return;
                }

                usersList.innerHTML = data.users.map(user => `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-username">${escapeHtml(user.username)}</div>
                            <div class="user-email">${user.email ? escapeHtml(user.email) : 'No email'}</div>
                        </div>
                        <div class="user-actions">
                            <span class="user-role">${user.role.toUpperCase()}</span>
                            ${user.role === 'user' ? `<button class="btn-small danger" onclick="deleteUser(${user.id})">DELETE</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-list').innerHTML = '<p style="color: #ff6b6b; font-family: var(--mono); font-size: 11px;">Error loading users</p>';
            }
        }

        async function createNewUser() {
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const email = document.getElementById('new-email').value.trim();
            const role = document.getElementById('new-role').value;
            const errorDiv = document.getElementById('create-error');
            const successDiv = document.getElementById('create-success');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!username || !password) {
                errorDiv.textContent = 'Username and password are required.';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('email', email);
                formData.append('role', role);

                const response = await fetch('/api/admin/create-user', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = 'User created successfully!';
                    successDiv.style.display = 'block';
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('new-email').value = '';
                    document.getElementById('new-role').value = 'user';
                    loadUsers();
                    setTimeout(() => {
                        switchAdminTab('users');
                    }, 1500);
                } else {
                    errorDiv.textContent = data.detail || 'Failed to create user.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Error creating user. Please try again.';
                errorDiv.style.display = 'block';
                console.error(error);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadUsers();
                } else {
                    alert('Failed to delete user');
                }
            } catch (error) {
                alert('Error deleting user');
                console.error(error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                window.location.href = '/admin/logout';
            }
        }
    </script>

</body>

</html>
