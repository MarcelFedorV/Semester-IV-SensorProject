<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/style/common.css">
    <script src="/languages/scripts.js"></script>
    <script src="/languages/translations.js"></script>
</head>

<body onload="loadLanguage();">

    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header>
        <div class="logo">
            <div>
                <a href="/" class="logo-link">
                    <div class="logo">
                        <div class="logo-icon"></div>
                        <div>
                                                        <div class="logo-text"><p class="languageclass" id="logo-text">SensorProject</p></div>
                            <div class="logo-sub"><p class="languageclass" id="logo-sub">Semester IV · Group 11</p></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div class="header-right">
            <select id="langSwitcher" name="language" style="margin-right:16px;"  onchange="setLanguage(this); saveLanguage();">
                <option value="en">EN</option>
                <option value="dk">DK</option>
            </select>
            <span class="status-dot"></span>
            system online
        </div>
    </header>

    <div class="main">
        <div class="card">

            <div class="card-header">
                <div class="card-eyebrow">Patient Portal</div>
                <div class="card-title">Welcome</div>
                <div class="card-sub">Sign in to your account</div>
            </div>

            <!-- Login panel -->
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" placeholder="e.g. john" id="login-id" autofocus>
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" placeholder="••••••••" id="login-pw">
            </div>
            
            {% if error %}
            <div style="color: #ff6b6b; font-size: 12px; margin-bottom: 10px;">{{ error }}</div>
            {% endif %}
            
            <div id="login-error" style="color: #ff6b6b; font-size: 12px; margin-bottom: 10px; display: none;"></div>
            <button class="btn btn-primary" onclick="handleLogin()">▶ Sign In</button>

            <div class="divider"></div>

            <div class="section-label">Staff Access</div>
            <a href="/admin/login" class="btn btn-secondary" style="margin-top: 10px;">Admin Portal</a>

        </div>
    </div>

    <footer>
        SEMESTER-IV-SENSORPROJECT &nbsp;·&nbsp; Meet the team of <a href="/developers">Group 11</a>
    </footer>

    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/check-auth');
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/';
                }
            } catch (error) {
                // Not logged in, stay on page
            }
        });

        async function handleLogin() {
            const username = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-pw').value.trim();
            const errorDiv = document.getElementById('login-error');

            if (!username || !password) {
                errorDiv.textContent = 'Please enter both username and password.';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                const authResponse = await fetch('/api/check-auth');
                const authData = await authResponse.json();

                if (authData.authenticated) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = 'Invalid username or password.';
                    errorDiv.style.display = 'block';
                    document.getElementById('login-pw').value = '';
                }
            } catch (error) {
                errorDiv.textContent = 'Login failed. Please try again.';
                errorDiv.style.display = 'block';
            }
        }

        // Enter key support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>

</body>

</html>
