<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="/style/common.css?v=20260518">
    <script src="/style/common.js" defer></script>
    <style>
        .game-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
            box-shadow: var(--shadow);
            text-decoration: none;
        }

        .game-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10), var(--shadow);
            transform: translateY(-2px);
        }

        .game-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
            display: block;
        }

        .game-card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        /* Game shell */
        .game-shell {
            display: none;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 57px - 45px);
        }

        .game-shell.active { display: flex; }

        .game-topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .game-topbar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .game-back-btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-muted);
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            cursor: pointer;
            font-family: var(--sans);
            transition: background 0.15s;
        }

        .game-back-btn:hover { background: #eef2f7; }

        .game-frame {
            flex: 1;
            border: none;
            width: 100%;
        }

        .main.shell-mode {
            padding: 0;
            width: 100%;
            max-width: 100%;
            align-items: stretch;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow"></div>

    <!-- Persistent BLE sensor widget -->
    <iframe src="/sensor-frame"
            allow="bluetooth"
            style="position:fixed;bottom:18px;right:18px;width:220px;height:44px;border:none;z-index:9999;background:transparent;"
    ></iframe>

    <header>
        <div class="logo">
            <a href="/" class="logo-link">
                <div class="logo">
                    <div class="logo-icon"></div>
                    <div>
                        <div class="logo-text"><p>SensorProject</p></div>
                        <div class="logo-sub"><p>Semester IV · Group 11</p></div>
                    </div>
                </div>
            </a>
        </div>
        <div class="card-eyebrow"><a href="/metrics" style="text-decoration:none;color:inherit;">Metrics</a></div>
        <div class="card-eyebrow" id="nav-games" style="cursor:pointer;">Games</div>
        <div class="header-right">
            <span class="status-dot"></span>
            system online
        </div>
    </header>

    <!-- Game picker -->
    <div class="main" id="pickerArea">
        <div class="game-picker">
            <div class="game-card" onclick="launchGame('fishing')">
                <img src="/style/fishing.png" alt="Fishing Game">
                <div class="game-card-title">Fishing Game</div>
            </div>
            <div class="game-card" onclick="launchGame('spacefunk')">
                <img src="/style/space.png" alt="Space Funk">
                <div class="game-card-title">Space Funk</div>
            </div>
            <div class="game-card" style="cursor:default;opacity:0.5;">
                <img src="/style/more.png" alt="More soon">
                <div class="game-card-title">More games coming soon</div>
            </div>
        </div>
    </div>

    <!-- Game shell -->
    <div class="main shell-mode" id="shellArea" style="display:none;">
        <div class="game-shell active">
            <div class="game-topbar">
                <button class="game-back-btn" onclick="exitGame()">← Back to Games</button>
                <span class="game-topbar-title" id="gameTitle"></span>
            </div>
            <iframe class="game-frame" id="gameFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        SEMESTER-IV-SENSORPROJECT &nbsp;·&nbsp; Meet the team of <a href="/developers">Group 11</a>
    </footer>

    <script>
        const GAMES = {
            fishing:   { title: 'Fishing Game', src: '/FishingGame/index.html' },
            spacefunk: { title: 'Space Funk',   src: '/SpaceFunk/index.html'   },
        };

        // Fetch user id once so we can pass it to games that need it
        let _userId = -1;
        const _userIdReady = fetch('/api/me')
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d && d.id) _userId = d.id; })
            .catch(() => {});

        const pickerArea = document.getElementById('pickerArea');
        const shellArea  = document.getElementById('shellArea');
        const gameFrame  = document.getElementById('gameFrame');
        const gameTitle  = document.getElementById('gameTitle');

        async function launchGame(key) {
            const game = GAMES[key];
            if (!game) return;
            gameTitle.textContent    = game.title;
            // Wait for user id to be ready before launching
            await _userIdReady;
            const uid = _userId > 0 ? _userId : -1;
            gameFrame.src            = game.src + (uid > 0 ? '?uid=' + uid : '');
            pickerArea.style.display = 'none';
            shellArea.style.display  = 'flex';
            history.pushState({ game: key }, '', '/games/' + key);
        }

        function exitGame() {
            gameFrame.src            = '';
            pickerArea.style.display = '';
            shellArea.style.display  = 'none';
            history.pushState({}, '', '/games');
        }

        window.addEventListener('popstate', async (e) => {
            if (e.state && e.state.game) await launchGame(e.state.game);
            else exitGame();
        });

        document.getElementById('nav-games').addEventListener('click', exitGame);

        // Auto-launch from URL on load — handles hard reloads of /games/fishing etc.
        const urlSlug = location.pathname.match(/^\/games\/([^/]+)/)?.[1];
        if (urlSlug && GAMES[urlSlug]) launchGame(urlSlug);
    </script>
</body>
</html>
