<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="/style/common.css">
    <script src="/style/common.js" defer></script>
</head>

<body>

    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header>
        <div class="logo">
            <div>
                <a href="/" class="logo-link">
                    <div class="logo">
                        <div class="logo-icon"></div>
                        <div>
                            <div class="logo-text">
                                <p class="languageclass" id="logo-text">SensorProject</p>
                            </div>
                            <div class="logo-sub">
                                <p class="languageclass" id="logo-sub">Semester IV · Group 11</p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
        <div class="card-eyebrow"><a href="/metrics" style="text-decoration: none; color: inherit;">Metrics</a></div>
        <div class="card-eyebrow"><a href="/games" style="text-decoration: none; color: inherit;">Games</a></div>
        <div class="header-right">
            <select id="langSwitcher" name="language" style="margin-right:16px;"
                onchange="setLanguage(this); saveLanguage();">
                <option value="en">EN</option>
                <option value="dk">DK</option>
            </select>
            <span class="status-dot"></span>
            system online
        </div>
    </header>

    <div class="main">
        <div class="games-grid">
            <a href="/FishingGame" class="game-card">
                <img src="/style/fishing.png" alt="Fishing Game">
                <div class="game-card-title">Fishing Game</div>
            </a>
            <a href="/SpaceFunk/Space.html" class="game-card">
                <img src="/style/space.png" alt="Space Funk">
                <div class="game-card-title">Space Funk</div>
            </a>
            <div class="game-card">
                <img src="/style/more.png" alt="More soon">
                <div class="game-card-title">More games coming soon</div>
            </div>
        </div>
    </div>

    <footer>
        SEMESTER-IV-SENSORPROJECT &nbsp;·&nbsp; Meet the team of <a href="/developers">Group 11</a>
    </footer>
</body>
