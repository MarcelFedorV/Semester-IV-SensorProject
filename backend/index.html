<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:       #0a0c0f;
    --surface:  #111418;
    --border:   #1e2530;
    --accent:   #00e5ff;
    --accent2:  #00ff9d;
    --warn:     #ff9500;
    --muted:    #3a4555;
    --text:     #c8d4e0;
    --text-dim: #5a6a7a;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 32px; height: 32px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-icon::before { content:''; width:10px; height:10px; background:var(--accent); border-radius:50%; }
  .logo-icon::after {
    content:''; position:absolute;
    width:22px; height:22px;
    border:1px solid var(--accent); border-radius:50%;
    opacity:0.4; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.4} 50%{transform:scale(1.3);opacity:0} }
  .logo-text { font-family:var(--mono); font-size:14px; font-weight:600; color:var(--accent); letter-spacing:.15em; text-transform:uppercase; }
  .logo-sub  { font-size:11px; color:var(--text-dim); letter-spacing:.05em; margin-top:2px; }
  .status-bar { display:flex; align-items:center; gap:20px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:6px; transition:background .3s; }
  .status-dot.active { background:var(--accent2); box-shadow:0 0 6px var(--accent2); }
  .status-dot.warn   { background:var(--warn);    box-shadow:0 0 6px var(--warn); }

  /* ── Layout ── */
  .container {
    flex:1; display:grid; grid-template-columns:280px 1fr;
    overflow:hidden; height:calc(100vh - 65px);
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; padding:20px; gap:12px; overflow-y:auto;
  }
  .section-label {
    font-family:var(--mono); font-size:10px; font-weight:600;
    color:var(--text-dim); letter-spacing:.15em; text-transform:uppercase; margin-bottom:4px;
  }
  .btn {
    font-family:var(--mono); font-size:12px; font-weight:500;
    padding:10px 16px; border-radius:4px; border:1px solid transparent;
    cursor:pointer; transition:all .15s; width:100%; text-align:left; letter-spacing:.05em;
  }
  .btn-primary  { background:rgba(0,229,255,.1); border-color:var(--accent);  color:var(--accent); }
  .btn-primary:hover:not(:disabled)  { background:rgba(0,229,255,.2); box-shadow:0 0 12px rgba(0,229,255,.2); }
  .btn-secondary { background:transparent; border-color:var(--border); color:var(--text-dim); }
  .btn-secondary:hover:not(:disabled){ border-color:var(--muted); color:var(--text); }
  .btn:disabled  { opacity:.35; cursor:not-allowed; }
  .btn-scanning  { background:rgba(0,255,157,.08); border-color:var(--accent2); color:var(--accent2); animation:scanpulse 1.5s ease-in-out infinite; }
  @keyframes scanpulse { 0%,100%{box-shadow:0 0 0 rgba(0,255,157,0)} 50%{box-shadow:0 0 16px rgba(0,255,157,.25)} }

  .slider-row { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  input[type=range] { flex:1; accent-color:var(--accent); height:3px; }
  .slider-val { color:var(--accent); min-width:30px; text-align:right; }
  .divider { height:1px; background:var(--border); }

  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:10px 12px; }
  .stat-value { font-family:var(--mono); font-size:20px; font-weight:600; color:var(--accent); }
  .stat-label { font-size:10px; color:var(--text-dim); margin-top:2px; letter-spacing:.05em; }

  .log {
    flex:1; background:var(--bg); border:1px solid var(--border); border-radius:4px;
    padding:10px; overflow-y:auto; font-family:var(--mono); font-size:10px;
    color:var(--text-dim); min-height:80px; max-height:180px;
  }
  .log-entry { padding:1px 0; }
  .log-entry.good  { color:var(--accent2); }
  .log-entry.warn  { color:var(--warn); }
  .log-entry.error { color:#ff5555; }

  /* ── Main panel ── */
  .main-panel { display:flex; flex-direction:column; overflow:hidden; }
  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--border); }
  .panel-title  { font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text-dim); letter-spacing:.15em; text-transform:uppercase; }
  .device-count { font-family:var(--mono); font-size:11px; color:var(--accent); }

  .device-list { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:6px; }
  .device-list::-webkit-scrollbar       { width:4px; }
  .device-list::-webkit-scrollbar-track { background:transparent; }
  .device-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  /* ── Device card ── */
  .device-card {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:14px 16px; cursor:pointer; transition:all .15s;
    display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
    animation:fadeSlideIn .2s ease forwards;
  }
  @keyframes fadeSlideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  .device-card:hover      { border-color:var(--accent); background:rgba(0,229,255,.04); }
  .device-card.selected   { border-color:var(--accent); background:rgba(0,229,255,.08); }
  .device-card.connected  { border-color:var(--accent2); background:rgba(0,255,157,.06); }
  .device-card.connecting { border-color:var(--warn); background:rgba(255,149,0,.04); animation:cardpulse 1s ease-in-out infinite; }
  @keyframes cardpulse { 0%,100%{border-color:var(--warn)} 50%{border-color:rgba(255,149,0,.3)} }

  .rssi-bar { display:flex; flex-direction:column; align-items:center; gap:3px; width:28px; }
  .rssi-bars { display:flex; align-items:flex-end; gap:2px; height:18px; }
  .rssi-bars span { width:4px; background:var(--muted); border-radius:1px; transition:background .3s; }
  .rssi-bars span:nth-child(1){height:5px} .rssi-bars span:nth-child(2){height:9px}
  .rssi-bars span:nth-child(3){height:14px} .rssi-bars span:nth-child(4){height:18px}
  .rssi-bars.strong span:nth-child(1),.rssi-bars.strong span:nth-child(2),
  .rssi-bars.strong span:nth-child(3),.rssi-bars.strong span:nth-child(4) { background:var(--accent2); }
  .rssi-bars.medium span:nth-child(1),.rssi-bars.medium span:nth-child(2),
  .rssi-bars.medium span:nth-child(3) { background:var(--accent); }
  .rssi-bars.weak span:nth-child(1),.rssi-bars.weak span:nth-child(2) { background:var(--warn); }
  .rssi-bars.very-weak span:nth-child(1) { background:#ff5555; }
  .rssi-value { font-family:var(--mono); font-size:9px; color:var(--text-dim); }

  .device-info { min-width:0; }
  .device-name { font-family:var(--mono); font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .device-name.unnamed { color:var(--text-dim); font-style:italic; }
  .device-address { font-family:var(--mono); font-size:10px; color:var(--text-dim); margin-top:3px; }
  .device-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
  .tag { font-family:var(--mono); font-size:9px; padding:2px 6px; border-radius:3px; background:var(--bg); border:1px solid var(--border); color:var(--text-dim); }
  .tag.connectable { border-color:rgba(0,229,255,.3); color:rgba(0,229,255,.7); }
  .tag.services    { border-color:rgba(0,255,157,.3); color:rgba(0,255,157,.7); }

  .device-actions { display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .btn-connect {
    font-family:var(--mono); font-size:10px; padding:5px 10px; border-radius:3px;
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .btn-connect:hover { border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,.08); }
  .btn-connect.connected { border-color:var(--accent2); color:var(--accent2); }
  .btn-connect.connecting { border-color:var(--warn); color:var(--warn); }
  .last-seen { font-family:var(--mono); font-size:9px; color:var(--text-dim); }

  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--text-dim); font-family:var(--mono); font-size:12px; }
  .empty-icon  { width:60px; height:60px; border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; opacity:.4; }

  /* ══════════════════════════════════════════════
     POPUP OVERLAY
  ══════════════════════════════════════════════ */
  .overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0; pointer-events:none;
    transition:opacity .2s;
  }
  .overlay.visible { opacity:1; pointer-events:all; }

  .popup {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    width:420px;
    max-width:90vw;
    padding:28px;
    position:relative;
    transform:translateY(12px);
    transition:transform .2s;
    z-index:101;
  }
  .overlay.visible .popup { transform:translateY(0); }

  .popup-icon {
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; margin-bottom:16px;
  }
  .popup-icon.accept  { background:rgba(0,255,157,.1);  border:1px solid rgba(0,255,157,.3); }
  .popup-icon.reject  { background:rgba(255,68,68,.1);   border:1px solid rgba(255,68,68,.3); }
  .popup-icon.loading { background:rgba(0,229,255,.1);   border:1px solid rgba(0,229,255,.3); animation:spinring 1.5s linear infinite; }
  .popup-icon.switch-mode { background:rgba(255,149,0,.1); border:1px solid rgba(255,149,0,.3); }

  @keyframes spinring { to { transform:rotate(360deg); } }

  .popup-title {
    font-family:var(--mono); font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px;
  }
  .popup-sub {
    font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:20px;
  }

  .popup-meta {
    background:var(--bg); border:1px solid var(--border); border-radius:6px;
    padding:14px; margin-bottom:20px; display:flex; flex-direction:column; gap:8px;
  }
  .meta-row { display:flex; justify-content:space-between; align-items:center; }
  .meta-key { font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:.05em; }
  .meta-val { font-family:var(--mono); font-size:11px; color:var(--text); }
  .meta-val.speed   { color:var(--accent); }
  .meta-val.cadence { color:var(--accent2); }
  .meta-val.xoss    { color:var(--warn); }

  .popup-actions { display:flex; gap:10px; }

  .popup-btn {
    flex:1; font-family:var(--mono); font-size:12px; padding:11px 16px;
    border-radius:5px; border:1px solid transparent; cursor:pointer; transition:all .15s;
    font-weight:500; letter-spacing:.05em;
  }
  .popup-btn.primary  { background:rgba(0,255,157,.12); border-color:var(--accent2); color:var(--accent2); }
  .popup-btn.primary:hover { background:rgba(0,255,157,.22); box-shadow:0 0 14px rgba(0,255,157,.2); }
  .popup-btn.ghost    { background:transparent; border-color:var(--border); color:var(--text-dim); }
  .popup-btn.ghost:hover { border-color:var(--muted); color:var(--text); }
  .popup-btn.danger   { background:rgba(255,68,68,.1); border-color:#ff4444; color:#ff4444; }
  .popup-btn.danger:hover { background:rgba(255,68,68,.2); }
  .popup-btn.switch-btn { background:rgba(255,149,0,.12); border-color:var(--warn); color:var(--warn); }
  .popup-btn.switch-btn:hover { background:rgba(255,149,0,.22); }
  .popup-btn:disabled { opacity:.35; cursor:not-allowed; }

  .switch-progress {
    background:var(--bg); border:1px solid var(--border); border-radius:5px;
    padding:10px 14px; font-family:var(--mono); font-size:11px; color:var(--accent);
    margin-bottom:16px; min-height:36px; display:none;
  }
  .switch-progress.visible { display:block; }

  .progress-bar-wrap {
    height:3px; background:var(--border); border-radius:2px; margin-top:10px; overflow:hidden; display:none;
  }
  .progress-bar-wrap.visible { display:block; }
  .progress-bar {
    height:100%; width:0; background:var(--accent);
    border-radius:2px; transition:width .3s; animation:progressAnim 1.5s ease-in-out infinite;
  }
  @keyframes progressAnim { 0%{width:0} 50%{width:70%} 100%{width:100%} }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <div>
      <div class="logo-text">BLE Scanner</div>
      <div class="logo-sub">Bluetooth Low Energy Device Monitor</div>
    </div>
  </div>
  <div class="status-bar">
    <div style="display:flex;align-items:center">
      <span class="status-dot" id="wsDot"></span>
      <span id="wsLabel">connecting…</span>
    </div>
    <div style="display:flex;align-items:center">
      <span class="status-dot" id="scanDot"></span>
      <span id="scanLabel">idle</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="sidebar">
    <div class="section-label">Scan</div>
    <button class="btn btn-primary"   id="btnScan" onclick="startScan()">▶ Start Scan</button>
    <button class="btn btn-scanning"  id="btnStop" style="display:none" onclick="stopScan()">■ Stop Scan</button>
    <button class="btn btn-secondary" id="btnCont" onclick="startContinuous()">⟳ Continuous</button>
    <div class="slider-row">
      <span>Duration</span>
      <input type="range" id="duration" min="3" max="30" value="8"
             oninput="document.getElementById('durVal').textContent=this.value+'s'">
      <span class="slider-val" id="durVal">8s</span>
    </div>
    <div class="divider"></div>
    <div class="section-label">Devices</div>
    <button class="btn btn-secondary" onclick="clearDevices()">✕ Clear List</button>
    <div class="divider"></div>
    <div class="section-label">Stats</div>
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-value" id="statCount">0</div>
        <div class="stat-label">Devices</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statConnected">—</div>
        <div class="stat-label">Connected</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="section-label">Log</div>
    <div class="log" id="log"></div>
  </div>

  <div class="main-panel">
    <div class="panel-header">
      <span class="panel-title">Nearby Devices</span>
      <span class="device-count" id="deviceCount">0 devices</span>
    </div>
    <div class="device-list" id="deviceList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📡</div>
        <span>No devices found yet</span>
        <span style="font-size:10px;opacity:.6">Press Start Scan to discover nearby BLE devices</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ POPUP ═══════════════ -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
  <div class="popup" id="popup" onclick="event.stopPropagation()">
    <div class="popup-icon" id="popupIcon">⏳</div>
    <div class="popup-title" id="popupTitle">Connecting…</div>
    <div class="popup-sub"   id="popupSub">Please wait</div>

    <div class="popup-meta" id="popupMeta" style="display:none">
      <div class="meta-row">
        <span class="meta-key">NAME</span>
        <span class="meta-val" id="metaName">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-key">ADDRESS</span>
        <span class="meta-val" id="metaAddr">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-key">MODE</span>
        <span class="meta-val" id="metaMode">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-key">LOCATION</span>
        <span class="meta-val" id="metaLoc">—</span>
      </div>
      <div class="meta-row">
        <span class="meta-key">FEATURES</span>
        <span class="meta-val" id="metaFeatures">—</span>
      </div>
    </div>

    <div class="switch-progress" id="switchProgress"></div>
    <div class="progress-bar-wrap" id="progressBarWrap"><div class="progress-bar"></div></div>

    <div class="popup-actions" id="popupActions"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const devices     = {};
let ws            = null;
let connectedTo   = null;
let connectedMode = null;
let connectingTo  = null;

// ── WebSocket ──────────────────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen    = () => { setWsStatus(true);  log('Server connected', 'good'); };
  ws.onclose   = () => { setWsStatus(false); log('Server disconnected — retrying…', 'warn'); setTimeout(connect, 3000); };
  ws.onerror   = () => log('WebSocket error', 'error');
  ws.onmessage = e  => handleMessage(JSON.parse(e.data));
}
function send(obj) { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

// ── Message handler ────────────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {

    case 'init':
      msg.devices.forEach(d => { devices[d.address] = d; });
      renderAll();
      if (msg.status.scanning)   setScanStatus(true);
      if (msg.status.connected)  { connectedTo = msg.status.connected_to; updateStatConnected(); }
      log(`Init: ${msg.devices.length} device(s)`, 'info');
      break;

    case 'device_updated':
      const d = msg.device;
      const isNew = !devices[d.address];
      devices[d.address] = d;
      if (isNew) { log(`Found: ${d.name || d.address}  RSSI:${d.rssi}`, 'good'); prependCard(d); }
      else         updateCard(d);
      updateCounts();
      break;

    case 'scan_started': setScanStatus(true);  log('Scan started', 'good'); break;
    case 'scan_stopped': setScanStatus(false); log('Scan stopped', 'info'); break;

    case 'device_removed':
      delete devices[msg.address];
      document.getElementById(`card-${msg.address.replace(/:/g,'-')}`)?.remove();
      if (connectedTo === msg.address) { connectedTo = null; connectedMode = null; updateStatConnected(); }
      updateCounts();
      if (!Object.keys(devices).length) renderAll();
      log(`Device left: ${msg.address}`, 'warn');
      break;

      Object.keys(devices).forEach(k => delete devices[k]);
      renderAll();
      log('Device list cleared', 'info');
      break;

    case 'connecting':
      connectingTo = msg.address;
      updateCard(devices[msg.address]);
      showPopupConnecting(msg.address);
      log(`Connecting to ${msg.address}…`, 'info');
      break;

    case 'connected':
      connectedTo = msg.address;
      updateStatConnected();
      log(`Connected: ${msg.address}`, 'good');
      break;

    case 'disconnected':
      if (connectedTo === msg.address) { connectedTo = null; connectedMode = null; }
      connectingTo = null;
      updateStatConnected();
      updateCard(devices[msg.address]);
      log(`Disconnected: ${msg.address}`, 'warn');
      break;

    case 'interrogation_result':
      connectingTo = null;
      handleInterrogationResult(msg.result);
      break;

    case 'switch_progress':
      showSwitchProgress(msg.message);
      log(`Switch: ${msg.message}`, 'info');
      break;

    case 'switch_done':
      handleSwitchDone(msg.result);
      break;

    case 'error':
      connectingTo = null;
      log(`Error: ${msg.message}`, 'error');
      showPopupError(msg.message);
      break;
  }
}

// ── Interrogation result popup ─────────────────────────────────────────────
function handleInterrogationResult(r) {
  if (!r.accepted) {
    showPopupRejected(r);
    log(`Rejected: ${r.name || r.address} — ${r.reason}`, 'warn');
    return;
  }
  connectedTo   = r.address;
  connectedMode = r.mode;
  showPopupAccepted(r);
  updateCard(devices[r.address]);
  log(`✓ Accepted: ${r.name} (${r.mode})`, 'good');
}

// ── Switch done ────────────────────────────────────────────────────────────
function handleSwitchDone(r) {
  document.getElementById('switchProgress').classList.remove('visible');
  document.getElementById('progressBarWrap').classList.remove('visible');

  if (!r.success) {
    log(`Switch failed: ${r.error}`, 'error');
    showPopupError(`Mode switch failed: ${r.error}`);
    return;
  }

  connectedTo = null; connectedMode = null;
  updateStatConnected();
  log(`✓ Switched to ${r.target_mode.toUpperCase()}. Scanning for sensor…`, 'good');

  setPopupIcon('accept', '✓');
  document.getElementById('popupTitle').textContent = `Switched to ${r.target_mode.toUpperCase()}`;
  document.getElementById('popupSub').textContent   = 'Sensor rebooted. Starting a scan to find it…';
  document.getElementById('popupMeta').style.display = 'none';
  document.getElementById('popupActions').innerHTML = `
    <button class="popup-btn ghost" onclick="closePopup()">Close</button>
  `;

  // Auto-scan so new device appears
  setTimeout(() => send({ action: 'scan', duration: 8 }), 500);
}

// ── Popup: connecting ──────────────────────────────────────────────────────
function showPopupConnecting(address) {
  setPopupIcon('loading', '⟳');
  document.getElementById('popupTitle').textContent = 'Connecting…';
  document.getElementById('popupSub').textContent   = `Checking ${address} for cycling sensor data`;
  document.getElementById('popupMeta').style.display    = 'none';
  document.getElementById('switchProgress').classList.remove('visible');
  document.getElementById('progressBarWrap').classList.remove('visible');
  document.getElementById('popupActions').innerHTML = `
    <button class="popup-btn ghost" onclick="closePopup()">Cancel</button>
  `;
  openPopup();
}

// ── Popup: accepted ────────────────────────────────────────────────────────
function showPopupAccepted(r) {
  setPopupIcon('accept', '🚲');
  document.getElementById('popupTitle').textContent = 'Cycling Sensor Found';
  document.getElementById('popupSub').textContent   = 'This device supports cycling data.';

  document.getElementById('metaName').textContent     = r.name || '—';
  document.getElementById('metaAddr').textContent     = r.address;
  document.getElementById('metaLoc').textContent      = r.location || '—';
  document.getElementById('metaFeatures').textContent = r.features?.join(', ') || '—';

  const modeEl = document.getElementById('metaMode');
  modeEl.textContent = r.mode || '—';
  modeEl.className   = `meta-val ${r.mode}`;

  document.getElementById('popupMeta').style.display = '';
  document.getElementById('switchProgress').classList.remove('visible');
  document.getElementById('progressBarWrap').classList.remove('visible');

  buildAcceptedActions(r.address, r.mode, r.is_xoss);
  openPopup();
}

function buildAcceptedActions(address, mode, is_xoss) {
  const targetMode  = mode === 'speed' ? 'cadence' : 'speed';
  const switchLabel = `Switch to ${targetMode.charAt(0).toUpperCase() + targetMode.slice(1)}`;

  document.getElementById('popupActions').innerHTML = `
    ${is_xoss ? `<button class="popup-btn switch-btn" onclick="doSwitch('${address}','${mode}')">${switchLabel}</button>` : ''}
    <button class="popup-btn ghost" onclick="closePopup()">Close</button>
    <button class="popup-btn danger" onclick="doDisconnect('${address}')">Disconnect</button>
  `;
}

// ── Popup: rejected ────────────────────────────────────────────────────────
function showPopupRejected(r) {
  setPopupIcon('reject', '✕');
  document.getElementById('popupTitle').textContent = 'Not a Cycling Sensor';
  document.getElementById('popupSub').textContent   = r.reason || 'This device does not support cycling sensor data.';
  document.getElementById('popupMeta').style.display    = 'none';
  document.getElementById('switchProgress').classList.remove('visible');
  document.getElementById('progressBarWrap').classList.remove('visible');
  document.getElementById('popupActions').innerHTML = `
    <button class="popup-btn ghost" onclick="closePopup()">Close</button>
  `;
  openPopup();
}

// ── Popup: error ───────────────────────────────────────────────────────────
function showPopupError(msg) {
  setPopupIcon('reject', '⚠');
  document.getElementById('popupTitle').textContent = 'Error';
  document.getElementById('popupSub').textContent   = msg;
  document.getElementById('popupMeta').style.display    = 'none';
  document.getElementById('switchProgress').classList.remove('visible');
  document.getElementById('progressBarWrap').classList.remove('visible');
  document.getElementById('popupActions').innerHTML = `
    <button class="popup-btn ghost" onclick="closePopup()">Close</button>
  `;
  openPopup();
}

// ── Switch ─────────────────────────────────────────────────────────────────
function doSwitch(address, currentMode) {
  const target = currentMode === 'speed' ? 'cadence' : 'speed';
  setPopupIcon('switch-mode', '⚡');
  document.getElementById('popupTitle').textContent = `Switching to ${target.toUpperCase()}…`;
  document.getElementById('popupSub').textContent   = 'Please wait, do not close this window.';
  document.getElementById('popupActions').innerHTML = '';
  document.getElementById('switchProgress').classList.add('visible');
  document.getElementById('progressBarWrap').classList.add('visible');
  send({ action: 'mode_switch', address, current_mode: currentMode });
}

function showSwitchProgress(msg) {
  const el = document.getElementById('switchProgress');
  el.textContent = msg;
  el.classList.add('visible');
}

// ── Disconnect ─────────────────────────────────────────────────────────────
function doDisconnect(address) {
  send({ action: 'disconnect' });
  closePopup();
}

// ── Popup helpers ──────────────────────────────────────────────────────────
function openPopup()  { document.getElementById('overlay').classList.add('visible'); }
function closePopup() { document.getElementById('overlay').classList.remove('visible'); }

function onOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closePopup();
}

function setPopupIcon(type, emoji) {
  const el = document.getElementById('popupIcon');
  el.className = `popup-icon ${type}`;
  el.textContent = emoji;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderAll() {
  const list   = document.getElementById('deviceList');
  list.innerHTML = '';
  const sorted = Object.values(devices).sort((a, b) => b.rssi - a.rssi);
  if (!sorted.length) {
    list.innerHTML = `<div class="empty-state" id="emptyState"><div class="empty-icon">📡</div><span>No devices found yet</span><span style="font-size:10px;opacity:.6">Press Start Scan to discover nearby BLE devices</span></div>`;
    return;
  }
  sorted.forEach(d => list.appendChild(makeCard(d)));
  updateCounts();
}

function prependCard(d) {
  document.getElementById('emptyState')?.remove();
  document.getElementById('deviceList').insertBefore(makeCard(d), document.getElementById('deviceList').firstChild);
  updateCounts();
}

function updateCard(d) {
  if (!d) return;
  const existing = document.getElementById(`card-${d.address.replace(/:/g,'-')}`);
  if (existing) existing.replaceWith(makeCard(d));
}

function makeCard(d) {
  const id       = d.address.replace(/:/g,'-');
  const isConn   = connectedTo   === d.address;
  const isConnecting = connectingTo === d.address;
  const cls      = isConn ? 'connected' : isConnecting ? 'connecting' : '';
  const rssiCls  = rssiStrength(d.rssi);
  const name     = d.name || '';
  const time     = new Date(d.last_seen).toLocaleTimeString();

  const card = document.createElement('div');
  card.className = `device-card ${cls}`.trim();
  card.id = `card-${id}`;

  let btnLabel = isConn ? '✓ connected' : isConnecting ? '…' : 'connect';
  let btnCls   = isConn ? 'connected' : isConnecting ? 'connecting' : '';

  card.innerHTML = `
    <div class="rssi-bar">
      <div class="rssi-bars ${rssiCls}"><span></span><span></span><span></span><span></span></div>
      <div class="rssi-value">${d.rssi}</div>
    </div>
    <div class="device-info">
      <div class="device-name${name?'':' unnamed'}">${name||'(unnamed)'}</div>
      <div class="device-address">${d.address}</div>
      <div class="device-tags">
        ${d.connectable?'<span class="tag connectable">connectable</span>':''}
        ${d.services.length?`<span class="tag services">${d.services.length} service${d.services.length>1?'s':''}</span>`:''}
        ${d.manufacturer?`<span class="tag">mfr ${d.manufacturer}</span>`:''}
      </div>
    </div>
    <div class="device-actions">
      <button class="btn-connect ${btnCls}"
        onclick="event.stopPropagation(); handleConnectClick('${d.address}')">
        ${btnLabel}
      </button>
      <span class="last-seen">${time}</span>
    </div>
  `;
  return card;
}

function rssiStrength(r) {
  if (r >= -60) return 'strong';
  if (r >= -70) return 'medium';
  if (r >= -80) return 'weak';
  return 'very-weak';
}

function handleConnectClick(address) {
  if (connectedTo === address) {
    // Already connected — reopen popup
    openPopup();
    return;
  }
  send({ action: 'connect', address });
}

// ── Controls ───────────────────────────────────────────────────────────────
function startScan()       { send({ action:'scan', duration: parseInt(document.getElementById('duration').value) }); }
function stopScan()        { send({ action:'stop_scan' }); }
function startContinuous() { send({ action:'scan_continuous' }); }
function clearDevices()    { send({ action:'clear' }); }

// ── UI helpers ─────────────────────────────────────────────────────────────
function setWsStatus(ok) {
  document.getElementById('wsDot').className    = `status-dot ${ok?'active':'warn'}`;
  document.getElementById('wsLabel').textContent = ok ? 'server ok' : 'disconnected';
}
function setScanStatus(on) {
  document.getElementById('scanDot').className     = `status-dot ${on?'active':''}`;
  document.getElementById('scanLabel').textContent  = on ? 'scanning…' : 'idle';
  document.getElementById('btnScan').style.display  = on ? 'none' : '';
  document.getElementById('btnStop').style.display  = on ? '' : 'none';
  document.getElementById('btnCont').disabled       = on;
}
function updateStatConnected() {
  document.getElementById('statConnected').textContent = connectedTo ? '✓' : '—';
}
function updateCounts() {
  const n = Object.keys(devices).length;
  document.getElementById('statCount').textContent   = n;
  document.getElementById('deviceCount').textContent = `${n} device${n!==1?'s':''}`;
}
function log(msg, type='info') {
  const el  = document.getElementById('log');
  const row = document.createElement('div');
  row.className   = `log-entry ${type}`;
  const t = new Date().toLocaleTimeString('en',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  row.textContent = `${t}  ${msg}`;
  el.prepend(row);
  while (el.children.length > 60) el.removeChild(el.lastChild);
}

connect();
</script>
