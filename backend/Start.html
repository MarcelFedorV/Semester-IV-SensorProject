<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialysis Fishing Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: white;
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #0d1a2a;
      border: 1px solid #1a3a5a;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .icon { font-size: 64px; }

    h1 {
      font-size: 1.8rem;
      text-align: center;
    }

    p {
      font-size: 0.95rem;
      color: #7abaea;
      text-align: center;
    }

    .btn {
      width: 100%;
      background: #1a3a5a;
      border: 1px solid #3a7aaa;
      color: #7abaea;
      border-radius: 10px;
      padding: 16px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .btn:hover { background: #2a4a6a; }

    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🐟</div>
    <h1>Fishing Game</h1>
    <p>Sønderborg Hospital — Dialysis Movement</p>
    <button class="btn" onclick="window.location.href='/game'">
      Start Session 🎣
    </button>
  </div>

  <div class="footer">Group 11 — SDU Intelligent Software Systems F26</div>

</body>
</html>
