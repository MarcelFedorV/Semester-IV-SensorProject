services:
  backend:
    build:
      context: ./backend
      dockerfile: ./container-stuff/backend.Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    networks:
      - app-network


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./backend/container-stuff/docker-cloudflare-tunnel.yml:/etc/cloudflared/config.yml
      - ./backend/container-stuff/credentials.json:/etc/cloudflared/credentials.json
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network: